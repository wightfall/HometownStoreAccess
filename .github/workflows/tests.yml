# Runs the unit tests on every pull request and on main. They need neither the game nor its
# assemblies (only the engine-independent core and the installer core are tested).
name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

# The tests only read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Unit tests
        run: dotnet test tests/HometownStoreAccess.Tests/HometownStoreAccess.Tests.csproj -c Release
